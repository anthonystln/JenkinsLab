version: '3.3'

services:
  postgres:
    image: postgres:16
    container_name: postgres_saas
    restart: unless-stopped
    environment:
      POSTGRES_USER: saas_user
      POSTGRES_PASSWORD: saas_pass
      POSTGRES_DB: saas_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saas_user -d saas_db"]
      interval: 15s
      timeout: 10s
      retries: 5
    networks:
      - saas_network

  redis:
    image: redis:7
    container_name: redis_saas
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - saas_network

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper_saas
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    healthcheck:
      test: ["CMD-SHELL", "echo ruok | nc localhost 2181 | grep imok || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 3
    networks:
      - saas_network

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka_saas
    restart: unless-stopped
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper_saas:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka_saas:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 9092 || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5
    networks:
      - saas_network

  app:
    build: .
    container_name: saas_backend
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
      - kafka
    ports:
      - "8082:8082"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      JAVA_OPTS: "-Xms256m -Xmx512m"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres_saas:5432/saas_db
      SPRING_DATASOURCE_USERNAME: saas_user
      SPRING_DATASOURCE_PASSWORD: saas_pass
      SPRING_DATA_REDIS_HOST: redis_saas
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka_saas:9092
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - saas_network

volumes:
  pgdata:

networks:
  saas_network:
    driver: bridge

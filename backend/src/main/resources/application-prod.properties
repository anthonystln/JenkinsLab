####################################
# DATABASE — PostgreSQL (production)
####################################
spring.datasource.url=jdbc:postgresql://postgres_saas:5432/saas_db
spring.datasource.username=saas_user
spring.datasource.password=saas_pass
spring.datasource.driver-class-name=org.postgresql.Driver

spring.sql.init.mode=never
spring.jpa.hibernate.ddl-auto=none

####################################
# JPA / Hibernate
####################################
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

####################################
# REDIS — Cache
####################################
spring.data.redis.host=redis_saas
spring.data.redis.port=6379

####################################
# KAFKA — Event Streaming
####################################
spring.kafka.bootstrap-servers=kafka_saas:9092
spring.kafka.consumer.group-id=saasboardx-group
spring.kafka.consumer.auto-offset-reset=latest
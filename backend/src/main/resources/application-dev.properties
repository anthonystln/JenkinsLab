####################################
# DATABASE — PostgreSQL (local)
####################################
spring.datasource.url=jdbc:postgresql://postgres_saas:5432/saas_db
spring.datasource.username=saas_user
spring.datasource.password=saas_pass
spring.datasource.driver-class-name=org.postgresql.Driver

spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

####################################
# JPA / Hibernate
####################################
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

####################################
# REDIS — Cache
####################################
spring.data.redis.host=redis_saas
spring.data.redis.port=6379

####################################
# KAFKA — Event Streaming
####################################
spring.kafka.bootstrap-servers=kafka_saas:9092
spring.kafka.consumer.group-id=saasboardx-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer